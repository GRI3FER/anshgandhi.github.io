<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Crossy Road 2.5D</title>
<style>
  /* Make body full viewport and center content horizontally, push canvas downward */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center; /* horizontal center */
    align-items: flex-start; /* align top, not vertical center */
    background: #649664;     /* same as game background */
    overflow: hidden;
  }
  canvas {
    display: block;
    margin-top: 100px; /* pushes the canvas downward */
  }
</style>
</head>
<body>
<canvas id="gameCanvas" width="800" height="900"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const WIDTH = canvas.width;
const HEIGHT = canvas.height;
const FPS = 60;
const LANE_HEIGHT = 80;

// Colors
const GRASS_BASE = '#2da046', GRASS_TOP = '#3ab954';
const ROAD_BASE = '#232328', ROAD_LINE = '#464646';
const WATER_BASE = '#1e64c8', WATER_TOP = '#3296ff';
const LOG_BASE = '#502814', LOG_TOP = '#784628';
const CHICKEN_BODY = '#ffffff', CHICKEN_RED = '#dc1e1e';

// --- Assets ---
function drawChicken(x, y) {
    ctx.fillStyle = '#c8c8c8';
    ctx.fillRect(x+5, y+15, 40, 40);
    ctx.fillStyle = CHICKEN_BODY;
    ctx.fillRect(x+5, y+5, 40, 35);
    ctx.fillStyle = CHICKEN_RED;
    ctx.fillRect(x+20, y, 10, 10);
    ctx.fillStyle = '#ffa500';
    ctx.beginPath();
    ctx.moveTo(x+45, y+15);
    ctx.lineTo(x+55, y+22);
    ctx.lineTo(x+45, y+30);
    ctx.fill();
}

function drawCar(x, y, color) {
    const dark = color.map(c => Math.max(0, c-40));
    ctx.fillStyle = `rgb(${dark.join(',')})`;
    ctx.fillRect(x+5, y+15, 100, 50);
    ctx.fillStyle = `rgb(${color.join(',')})`;
    ctx.fillRect(x+5, y+5, 100, 45);
    ctx.fillRect(x+30, y+10, 50, 25);
    ctx.fillStyle = 'rgb(200,230,255)';
    ctx.fillRect(x+35, y+12, 40, 12);
}

function drawLog(x, y) {
    ctx.fillStyle = LOG_BASE;
    ctx.fillRect(x, y+10, 180, 50);
    ctx.fillStyle = LOG_TOP;
    ctx.fillRect(x, y, 180, 45);
}

// --- Game State ---
let state = {
    p_world: [WIDTH/2, 12],
    lanes: {},
    score: 0,
    max_y: 12,
    high: 0,
    over: false,
    cam_y: 12*LANE_HEIGHT - 500
};

// Key handling
const keys = {};
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

// --- Lane Class ---
class Lane {
    constructor(index, type, score) {
        this.index = index;
        this.type = type;
        this.objects = [];
        this.speed = (Math.random()<0.5?-1:1)*(3+Math.random()*1)*(1 + score/500);
        let curr_x = Math.random()*WIDTH;
        for(let i=0;i<3;i++){
            this.spawnObj(curr_x);
            curr_x += 300 + Math.random()*150;
        }
    }

    spawnObj(x=null){
        if(x===null) x = this.speed>0?-200:WIDTH+50;
        if(this.type==='road') this.objects.push({x:x, y:0, w:90, h:50});
        else if(this.type==='water') this.objects.push({x:x, y:0, w:170, h:55});
    }

    update(){
        for(let obj of this.objects) obj.x += this.speed;
        if(this.objects.length<4 && Math.random()<0.01) this.spawnObj();
        this.objects = this.objects.filter(o=>o.x>-500 && o.x<WIDTH+500);
    }
}

// --- Game Functions ---
function resetGame() {
    state.lanes = {};
    for(let i=-50;i<15;i++){
        let type = i<10 ? ['grass','road','water'][Math.floor(Math.random()*3)] : 'grass';
        state.lanes[i] = new Lane(i, type, state.score);
    }
    state.p_world = [WIDTH/2,12];
    state.score = 0;
    state.max_y = 12;
    state.over = false;
    state.cam_y = 12*LANE_HEIGHT - 500;
}

// --- Game Loop ---
function gameLoop(){
    ctx.fillStyle = '#649664';
    ctx.fillRect(0,0,WIDTH,HEIGHT);

    // Camera follow
    state.cam_y += ((state.p_world[1]*LANE_HEIGHT-500) - state.cam_y)*0.1;

    // Movement
    if(!state.over){
        if(keys['ArrowUp']||keys['w']){ 
            state.p_world[1]-=1;
            if(state.p_world[1]<state.max_y){
                state.max_y = state.p_world[1];
                state.score++;
            }
            keys['ArrowUp']=keys['w']=false;
        }
        if(keys['ArrowDown']||keys['s']){
            if(state.p_world[1]<state.max_y+5) state.p_world[1]+=1;
            keys['ArrowDown']=keys['s']=false;
        }
        if(keys['ArrowLeft']||keys['a']){ state.p_world[0]-=60; keys['ArrowLeft']=keys['a']=false;}
        if(keys['ArrowRight']||keys['d']){ state.p_world[0]+=60; keys['ArrowRight']=keys['d']=false;}
    } else if(keys[' ']){
        resetGame();
        keys[' ']=false;
    }

    // Draw lanes back-to-front
    let visible_range = [Math.floor(state.cam_y/LANE_HEIGHT)-2, Math.floor(state.cam_y/LANE_HEIGHT)+14];
    let on_log=false, in_water=false;

    Object.keys(state.lanes).sort((a,b)=>b-a).forEach(k=>{
        let l = state.lanes[k];
        if(l.index<visible_range[0] || l.index>visible_range[1]) return;
        l.update();
        let draw_y = l.index*LANE_HEIGHT - state.cam_y;
        // Lane floor
        if(l.type==='grass'){
            ctx.fillStyle = GRASS_BASE; ctx.fillRect(0, draw_y+5, WIDTH, LANE_HEIGHT);
            ctx.fillStyle = GRASS_TOP; ctx.fillRect(0, draw_y, WIDTH, LANE_HEIGHT-5);
        } else if(l.type==='road'){
            ctx.fillStyle = ROAD_BASE; ctx.fillRect(0, draw_y, WIDTH, LANE_HEIGHT);
            ctx.fillStyle = ROAD_LINE; ctx.fillRect(0, draw_y+LANE_HEIGHT/2, WIDTH,2);
        } else if(l.type==='water'){
            ctx.fillStyle = WATER_BASE; ctx.fillRect(0, draw_y+5, WIDTH, LANE_HEIGHT);
            ctx.fillStyle = WATER_TOP; ctx.fillRect(0, draw_y, WIDTH, LANE_HEIGHT-5);
        }

        let playerHitbox = {x: state.p_world[0]+10, y: state.p_world[1]*LANE_HEIGHT+20, w:30, h:30};

        for(let obj of l.objects){
            let objWorld = {x: obj.x, y: l.index*LANE_HEIGHT, w: obj.w, h: obj.h};
            let objDrawY = draw_y + (LANE_HEIGHT-obj.h)/2;
            if(l.type==='road'){
                drawCar(obj.x, objDrawY-10,[220,50,50]);
                if(collide(playerHitbox,objWorld)) state.over = true;
            } else if(l.type==='water'){
                drawLog(obj.x,objDrawY-10);
                if(collide(playerHitbox,objWorld)){
                    on_log=true;
                    state.p_world[0]+=l.speed;
                }
            }
        }

        if(l.index===state.p_world[1] && l.type==='water') in_water = true;
    });

    // Draw player
    drawChicken(state.p_world[0], state.p_world[1]*LANE_HEIGHT - state.cam_y);

    // Post-update logic
    if((in_water && !on_log) || state.p_world[0]<-20 || state.p_world[0]>WIDTH-20) state.over=true;
    if(state.score>state.high) state.high=state.score;

    // UI
    ctx.fillStyle='white'; ctx.font='24px Verdana';
    ctx.fillText(`SCORE: ${state.score}`,20,30);
    ctx.fillStyle='rgb(255,200,0)'; ctx.fillText(`HIGH: ${state.high}`,20,60);

    // Game over overlay
    if(state.over){
        ctx.fillStyle='rgba(0,0,0,0.6)';
        ctx.fillRect(0,0,WIDTH,HEIGHT);
        ctx.fillStyle='white'; ctx.font='30px Verdana';
        ctx.fillText("GAME OVER - SPACE TO RESTART",WIDTH/2-180,HEIGHT/2);
    }

    requestAnimationFrame(gameLoop);
}

function collide(a,b){
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

resetGame();
gameLoop();
</script>
</body>
</html>
