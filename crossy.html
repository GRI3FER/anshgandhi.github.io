<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crossy Road 2.5D</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100vh;
            background: transparent;
            font-family: 'Verdana', sans-serif;
        }
        
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        #gameContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="900"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // --- Settings & Aesthetics ---
        const WIDTH = 800, HEIGHT = 900;
        const FPS = 60;
        const LANE_HEIGHT = 80;
        
        // Voxel-ish Palette
        const GRASS_BASE = [45, 160, 70];
        const GRASS_TOP = [58, 185, 84];
        const ROAD_BASE = [35, 35, 40];
        const ROAD_LINE = [70, 70, 80];
        const WATER_BASE = [30, 100, 200];
        const WATER_TOP = [50, 150, 255];
        const LOG_BASE = [80, 40, 20];
        const LOG_TOP = [120, 70, 40];
        const CHICKEN_BODY = [255, 255, 255];
        const CHICKEN_RED = [220, 30, 30];
        
        // Helper functions
        function rgb(arr) {
            return `rgb(${arr[0]}, ${arr[1]}, ${arr[2]})`;
        }
        
        function rectCollide(r1, r2) {
            return r1.x < r2.x + r2.w &&
                   r1.x + r1.w > r2.x &&
                   r1.y < r2.y + r2.h &&
                   r1.y + r1.h > r2.y;
        }
        
        // Sprite generators
        function getChickenSprite() {
            const surf = document.createElement('canvas');
            surf.width = 50;
            surf.height = 60;
            const c = surf.getContext('2d');
            
            c.fillStyle = 'rgb(200, 200, 200)';
            c.beginPath();
            c.roundRect(5, 15, 40, 40, 8);
            c.fill();
            
            c.fillStyle = rgb(CHICKEN_BODY);
            c.beginPath();
            c.roundRect(5, 5, 40, 35, 8);
            c.fill();
            
            c.fillStyle = rgb(CHICKEN_RED);
            c.beginPath();
            c.roundRect(20, 0, 10, 10, 2);
            c.fill();
            
            c.fillStyle = 'rgb(255, 165, 0)';
            c.beginPath();
            c.moveTo(45, 15);
            c.lineTo(55, 22);
            c.lineTo(45, 30);
            c.fill();
            
            return surf;
        }
        
        function getCarSprite(color) {
            const surf = document.createElement('canvas');
            surf.width = 110;
            surf.height = 70;
            const c = surf.getContext('2d');
            
            const darkColor = color.map(x => Math.max(0, x - 40));
            
            c.fillStyle = rgb(darkColor);
            c.beginPath();
            c.roundRect(5, 15, 100, 50, 12);
            c.fill();
            
            c.fillStyle = rgb(color);
            c.beginPath();
            c.roundRect(5, 5, 100, 45, 12);
            c.fill();
            
            c.beginPath();
            c.roundRect(30, 10, 50, 25, 5);
            c.fill();
            
            c.fillStyle = 'rgb(200, 230, 255)';
            c.beginPath();
            c.roundRect(35, 12, 40, 12, 2);
            c.fill();
            
            return surf;
        }
        
        function getLogSprite() {
            const surf = document.createElement('canvas');
            surf.width = 180;
            surf.height = 60;
            const c = surf.getContext('2d');
            
            c.fillStyle = rgb(LOG_BASE);
            c.beginPath();
            c.roundRect(0, 10, 180, 50, 20);
            c.fill();
            
            c.fillStyle = rgb(LOG_TOP);
            c.beginPath();
            c.roundRect(0, 0, 180, 45, 20);
            c.fill();
            
            return surf;
        }
        
        // Pre-bake assets
        const ASSETS = {
            chicken: getChickenSprite(),
            car: getCarSprite([220, 50, 50]),
            log: getLogSprite()
        };
        
        // Lane class
        class Lane {
            constructor(index, type, score) {
                this.index = index;
                this.type = type;
                this.objects = [];
                this.speed = [- 4, -3, 3, 4][Math.floor(Math.random() * 4)] * (1 + score / 500);
                let currX = Math.random() * WIDTH;
                for (let i = 0; i < 3; i++) {
                    this.spawnObj(currX);
                    currX += 300 + Math.random() * 100 + 50;
                }
            }
            
            spawnObj(x = null) {
                if (x === null) x = this.speed > 0 ? -200 : WIDTH + 50;
                if (this.type === "road") {
                    this.objects.push({x: x, y: 0, w: 90, h: 50});
                } else if (this.type === "water") {
                    this.objects.push({x: x, y: 0, w: 170, h: 55});
                }
            }
            
            update() {
                for (let obj of this.objects) {
                    obj.x += this.speed;
                }
                if (this.objects.length < 4 && Math.random() < 0.01) {
                    this.spawnObj();
                }
                this.objects = this.objects.filter(o => o.x > -500 && o.x < WIDTH + 500);
            }
        }
        
        // Game state
        let state = {high: 0};
        
        function resetGame() {
            const lanes = {};
            for (let i = -50; i < 15; i++) {
                const type = i < 10 ? ["grass", "road", "water"][Math.floor(Math.random() * 3)] : "grass";
                lanes[i] = new Lane(i, type, 0);
            }
            
            return {
                p_world: [WIDTH / 2, 12],
                lanes: lanes,
                score: 0,
                max_y: 12,
                high: state.high,
                over: false,
                cam_y: 12 * LANE_HEIGHT - 500
            };
        }
        
        state = resetGame();
        
        // Input handling
        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            
            if (!state.over) {
                if (e.key.toLowerCase() === 'w') {
                    state.p_world[1] -= 1;
                    if (state.p_world[1] < state.max_y) {
                        state.max_y = state.p_world[1];
                        state.score += 1;
                    }
                }
                if (e.key.toLowerCase() === 's') {
                    if (state.p_world[1] < state.max_y + 5) {
                        state.p_world[1] += 1;
                    }
                }
                if (e.key.toLowerCase() === 'a') {
                    state.p_world[0] -= 60;
                }
                if (e.key.toLowerCase() === 'd') {
                    state.p_world[0] += 60;
                }
            } else if (e.key === ' ') {
                state = resetGame();
            }
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });
        
        // Main game loop
        function gameLoop() {
            // Clear screen
            ctx.fillStyle = 'rgb(100, 150, 100)';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            
            // Update camera
            state.cam_y += ((state.p_world[1] * LANE_HEIGHT - 500) - state.cam_y) * 0.1;
            
            if (!state.over) {
                let onLog = false;
                let inWater = false;
                
                const visibleStart = Math.floor(state.cam_y / LANE_HEIGHT) - 2;
                const visibleEnd = Math.floor(state.cam_y / LANE_HEIGHT) + 14;
                
                const sortedIndices = Object.keys(state.lanes).map(Number).sort((a, b) => b - a);
                
                for (let i of sortedIndices) {
                    if (i < visibleStart || i > visibleEnd) continue;
                    
                    const l = state.lanes[i];
                    l.update();
                    
                    const drawY = (l.index * LANE_HEIGHT) - state.cam_y;
                    
                    // Draw lane
                    if (l.type === "grass") {
                        ctx.fillStyle = rgb(GRASS_BASE);
                        ctx.fillRect(0, drawY + 5, WIDTH, LANE_HEIGHT);
                        ctx.fillStyle = rgb(GRASS_TOP);
                        ctx.fillRect(0, drawY, WIDTH, LANE_HEIGHT - 5);
                    } else if (l.type === "road") {
                        ctx.fillStyle = rgb(ROAD_BASE);
                        ctx.fillRect(0, drawY, WIDTH, LANE_HEIGHT);
                        ctx.fillStyle = rgb(ROAD_LINE);
                        ctx.fillRect(0, drawY + LANE_HEIGHT / 2, WIDTH, 2);
                    } else if (l.type === "water") {
                        ctx.fillStyle = rgb(WATER_BASE);
                        ctx.fillRect(0, drawY + 5, WIDTH, LANE_HEIGHT);
                        ctx.fillStyle = rgb(WATER_TOP);
                        ctx.fillRect(0, drawY, WIDTH, LANE_HEIGHT - 5);
                    }
                    
                    // Player hitbox
                    const playerHitbox = {
                        x: state.p_world[0] + 10,
                        y: state.p_world[1] * LANE_HEIGHT + 20,
                        w: 30,
                        h: 30
                    };
                    
                    // Draw objects and check collisions
                    for (let obj of l.objects) {
                        const objWorldRect = {
                            x: obj.x,
                            y: l.index * LANE_HEIGHT,
                            w: obj.w,
                            h: obj.h
                        };
                        
                        const objDrawY = drawY + (LANE_HEIGHT - obj.h) / 2;
                        
                        if (l.type === "road") {
                            ctx.drawImage(ASSETS.car, obj.x, objDrawY - 10);
                            if (rectCollide(playerHitbox, objWorldRect)) {
                                state.over = true;
                            }
                        } else if (l.type === "water") {
                            ctx.drawImage(ASSETS.log, obj.x, objDrawY - 10);
                            if (rectCollide(playerHitbox, objWorldRect)) {
                                onLog = true;
                                state.p_world[0] += l.speed;
                            }
                        }
                    }
                    
                    if (l.index === state.p_world[1] && l.type === "water") {
                        inWater = true;
                    }
                }
                
                // Draw player
                const px = state.p_world[0];
                const py = (state.p_world[1] * LANE_HEIGHT) - state.cam_y;
                ctx.drawImage(ASSETS.chicken, px, py);
                
                // Check death conditions
                if ((inWater && !onLog) || px < -20 || px > WIDTH - 20) {
                    state.over = true;
                }
                
                if (state.score > state.high) {
                    state.high = state.score;
                }
                
                // Draw score
                ctx.font = 'bold 24px Verdana';
                ctx.fillStyle = 'white';
                ctx.fillText(`SCORE: ${state.score}`, 20, 40);
                ctx.fillStyle = 'rgb(255, 200, 0)';
                ctx.fillText(`HIGH: ${state.high}`, 20, 70);
            } else {
                // Game over overlay
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(0, 0, WIDTH, HEIGHT);
                ctx.font = 'bold 24px Verdana';
                ctx.fillStyle = 'white';
                ctx.fillText('GAME OVER - SPACE TO RESTART', WIDTH / 2 - 220, HEIGHT / 2);
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        // Start game
        gameLoop();
    </script>
</body>
</html>
